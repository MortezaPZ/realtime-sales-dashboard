<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Realtime Sales</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb;
    --plane: #f9f9f7;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --base: #c3c2b7;
    --border: rgba(11,11,11,.1);
    --series: #2a78d6;
    --good: #0ca30c;
    --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface: #1a1a19; --plane: #0d0d0d; --ink: #fff; --ink-2: #c3c2b7;
      --grid: #2c2c2a; --base: #383835; --border: rgba(255,255,255,.1);
      --series: #3987e5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 24px 56px; background: var(--plane); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 1180px; margin-inline: auto;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  .status { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 7px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--good); }
  .dot.down { background: var(--critical); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  .label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .value { font-size: 30px; font-weight: 600; line-height: 1.2; margin-top: 6px; }
  .caption { font-size: 12px; color: var(--ink-2); }
  .grid2 { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 20px; }
  @media (min-width: 860px) { .grid2 { grid-template-columns: 3fr 2fr; } }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
  .sub { font-size: 13px; color: var(--ink-2); margin-bottom: 14px; }
  svg { width: 100%; height: auto; display: block; }
  .bar { fill: var(--series); }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--base); stroke-width: 1; }
  .tick { fill: var(--muted); font-size: 9px; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; font-weight: 500; text-transform: uppercase;
       letter-spacing: .04em; color: var(--muted); padding: 7px 10px 7px 0; border-bottom: 1px solid var(--border); }
  td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--grid); color: var(--ink-2); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
  .meter { height: 5px; border-radius: 3px; background: var(--series); min-width: 2px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Realtime Sales</h1>
    <div class="caption" id="window">connecting…</div>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="state">connecting</span></div>
</header>

<section class="tiles">
  <div class="card"><div class="label">Revenue</div><div class="value" id="revenue">—</div><div class="caption" id="win-note"></div></div>
  <div class="card"><div class="label">Orders</div><div class="value" id="orders">—</div></div>
  <div class="card"><div class="label">Avg order</div><div class="value" id="aov">—</div></div>
  <div class="card"><div class="label">Updated</div><div class="value" id="updated" style="font-size:20px">—</div><div class="caption" id="latency"></div></div>
</section>

<section class="grid2">
  <div class="card">
    <h2>Revenue over time</h2>
    <div class="sub" id="bucket-note">live window</div>
    <svg id="chart" viewBox="0 0 640 220" preserveAspectRatio="none" role="img" aria-label="Revenue per time bucket"></svg>
  </div>
  <div class="card">
    <h2>By region</h2>
    <div class="sub">share of window revenue</div>
    <table><thead><tr><th>Region</th><th style="text-align:right">Revenue</th><th style="text-align:right">Orders</th></tr></thead>
    <tbody id="regions"></tbody></table>
  </div>
</section>

<section class="card">
  <h2>By channel</h2>
  <div class="sub">share of window revenue</div>
  <table><thead><tr><th>Channel</th><th style="text-align:right">Revenue</th><th style="text-align:right">Orders</th><th style="text-align:right">Avg</th></tr></thead>
  <tbody id="channels"></tbody></table>
</section>

<script>
const money = n => '£' + n.toLocaleString('en-GB', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const el = id => document.getElementById(id);
let lastAt = null;

function setState(text, cls) {
  el('state').textContent = text;
  el('dot').className = 'dot' + (cls ? ' ' + cls : '');
}

function drawChart(buckets) {
  const svg = el('chart');
  const W = 640, H = 220, PAD_L = 46, PAD_B = 26, PAD_T = 10;
  if (!buckets.length) { svg.innerHTML = ''; return; }

  const peak = Math.max(...buckets.map(b => b.revenue), 1);
  const plotW = W - PAD_L - 10, plotH = H - PAD_B - PAD_T;
  const slot = plotW / buckets.length;
  const barW = Math.max(2, slot * 0.68);
  let out = '';

  for (let i = 0; i <= 3; i++) {
    const y = PAD_T + plotH - (plotH * i / 3);
    out += `<line class="gridline" x1="${PAD_L}" y1="${y}" x2="${W - 10}" y2="${y}"/>`;
    out += `<text class="tick" x="${PAD_L - 6}" y="${y + 3}" text-anchor="end">${Math.round(peak * i / 3)}</text>`;
  }

  buckets.forEach((b, i) => {
    const h = Math.max(0, (b.revenue / peak) * plotH);
    const x = PAD_L + i * slot + (slot - barW) / 2;
    const y = PAD_T + plotH - h;
    const t = new Date(b.startsAt).toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'});
    out += `<rect class="bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="3"><title>${t} — ${money(b.revenue)} (${b.orders} orders)</title></rect>`;
    if (i % Math.ceil(buckets.length / 6) === 0) {
      out += `<text class="tick" x="${(x + barW / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${t}</text>`;
    }
  });

  out += `<line class="axis" x1="${PAD_L}" y1="${PAD_T + plotH}" x2="${W - 10}" y2="${PAD_T + plotH}"/>`;
  svg.innerHTML = out;
}

function drawTable(id, rows, total, withAvg) {
  el(id).innerHTML = rows.map(r => {
    const pct = total > 0 ? (r.revenue / total * 100) : 0;
    const avg = withAvg ? `<td class="num">${money(r.averageOrderValue)}</td>` : '';
    return `<tr><td>${r.key}<div class="meter" style="width:${pct.toFixed(1)}%"></div></td>` +
           `<td class="num">${money(r.revenue)}</td><td class="num">${r.orders}</td>${avg}</tr>`;
  }).join('') || `<tr><td colspan="4" style="color:var(--muted)">waiting for data…</td></tr>`;
}

function render(s) {
  el('revenue').textContent = money(s.revenue);
  el('orders').textContent = s.orders.toLocaleString();
  el('aov').textContent = money(s.averageOrderValue);
  el('win-note').textContent = `last ${s.windowMinutes} minutes`;
  el('window').textContent = `rolling ${s.windowMinutes}-minute window`;
  el('bucket-note').textContent = `${s.timeline.length} buckets across ${s.windowMinutes} minutes`;

  const at = new Date(s.generatedAt);
  el('updated').textContent = at.toLocaleTimeString('en-GB');
  if (lastAt) el('latency').textContent = `${at - lastAt}ms since last push`;
  lastAt = at;

  drawChart(s.timeline);
  drawTable('regions', s.byRegion, s.revenue, false);
  drawTable('channels', s.byChannel, s.revenue, true);
}

const connection = new signalR.HubConnectionBuilder()
  .withUrl('/hub/dashboard')
  .withAutomaticReconnect()
  .build();

connection.on('snapshot', render);
connection.onreconnecting(() => setState('reconnecting', ''));
connection.onreconnected(() => setState('live', 'live'));
connection.onclose(() => setState('disconnected', 'down'));

connection.start()
  .then(() => setState('live', 'live'))
  .catch(err => { setState('failed', 'down'); console.error(err); });
</script>
</body>
</html>
